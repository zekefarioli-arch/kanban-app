<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .kanban-board {
            display: flex;
            gap: 20px;
        }
        .column {
            width: 30%;
            min-width: 300px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #fff;
        }
        .card {
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 3px;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <div class="kanban-board">
        <div class="column" id="to-do">
            <h2>To Do</h2>
            <div class="card">Card 1: Implement feature X</div>
            <div class="card">Card 2: Review documentation</div>
        </div>
        <div class="column" id="in-progress">
            <h2>In Progress</h2>
            <div class="card">Card 3: Design UI component</div>
            <div class="card">Card 4: Write unit tests</div>
        </div>
        <div class="column" id="done">
            <h2>Done</h2>
            <div class="card">Card 5: Setup project structure</div>
            <div class="card">Card 6: Initial commit</div>
        </div>
    </div>

    <script>
        // JavaScript to add cards dynamically can be added here
    </script>
</body>
</html>
