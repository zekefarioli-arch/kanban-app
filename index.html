<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body >
    <div class="kanban-board">
        <div class="column" id="to-do">
            <h2>To Do</h2>
            <form class="add-card-form">
                <input type="text" placeholder="New card description..." required>
                <button type="submit">Add Card</button>
            </form>
            <div class="card">Card 1: Implement feature X</div>
            <div class="card">Card 2: Review documentation</div>
        </div >
        <div class="column" id="in-progress">
            <h2>In Progress</h2>
            <form class="add-card-form">
                <input type="text" placeholder="New card description..." required>
                <button type="submit">Add Card</button>
            </form>
            <div class="card">Card 3: Design UI component</div>
            <div class="card">Card 4: Write unit tests</div>
        </div >
        <div class="column" id="done">
            <h2>Done</h2>
            <form class="add-card-form">
                <input type="text" placeholder="New card description..." required>
                <button type="submit">Add Card</button>
            </form>
            <div class="card">Card 5: Setup project structure</div>
            <div class="card">Card 6: Initial commit</div>
        </div >
    </div >

    <script src="script.js"></script>
</body >
</html>
